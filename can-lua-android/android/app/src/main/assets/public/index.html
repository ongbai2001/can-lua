<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sổ Cân Lúa</title>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: một màn hình dọc kiểu app. Thanh tiêu đề xanh, lưới thẻ 5 cột (mỗi thẻ 5 bao), bảng tổng và ô nhập cố định phía dưới. */
:root {
  --bar: #14496b;
  --bar-fg: #ffffff;
  --bg: #eef1f4;
  --card: #ffffff;
  --fg: #16202a;
  --muted: #6b7a88;
  --line: #d5dce3;
  --sub: #c4161c;
  --kg: #c2410c;
  --bao: #1b3a8f;
  --chip: #e6ebf0;
  --accent: #14496b;
  --badge: #14496b;
  --danger: #b42318;
  --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bar: #0d2f45; --bar-fg: #f2f6f9; --bg: #10171d; --card: #1a232b; --fg: #e8eef3;
    --muted: #8a9aa8; --line: #2c3945; --sub: #ff6b6b; --kg: #ff9a62; --bao: #8fb0ff;
    --chip: #232f39; --accent: #5fa8d3; --badge: #2a6f9a; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bar: #0d2f45; --bar-fg: #f2f6f9; --bg: #10171d; --card: #1a232b; --fg: #e8eef3;
  --muted: #8a9aa8; --line: #2c3945; --sub: #ff6b6b; --kg: #ff9a62; --bao: #8fb0ff;
  --chip: #232f39; --accent: #5fa8d3; --badge: #2a6f9a; --danger: #ff8a80; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bar); z-index: 10; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.view { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.bar {
  background: var(--bar); color: var(--bar-fg); display: flex; align-items: center; gap: 4px;
  padding-block: 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  min-height: 60px; flex: none;
}
.bar h1 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 8px; }
.ib { background: none; border: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: inherit; flex: none; }
.ib:active { background: rgba(255,255,255,.16); }
.ib svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* Danh sách phiếu */
.list { flex: 1; min-height: 0; overflow-y: auto; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: stretch; width: 100%; overflow: hidden; }
.row .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: 0; text-align: left; }
.row .rdel { flex: none; width: 52px; background: none; border: 0; border-left: 1px solid var(--line); color: var(--danger); display: grid; place-items: center; }
.row .rdel:active { background: var(--chip); }
.row .rdel svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.toast { display: flex; align-items: center; gap: 14px; }
.toast button { background: none; border: 0; color: #8fd0ff; font-weight: 700; padding: 4px 2px; }
.row .nm { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .dt { color: var(--muted); font-size: 13px; margin-top: 2px; }
.row .grow { flex: 1; min-width: 0; }
.row .num { text-align: right; }
.row .num b { display: block; color: var(--kg); font-size: 17px; font-weight: 700; }
.row .num span { color: var(--bao); font-size: 13px; font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 40px 12px; line-height: 1.5; }
.foot { flex: none; padding-top: 10px; padding-bottom: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.btn { width: 100%; min-height: 48px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.btn.fill { background: var(--accent); color: var(--card); }
:root[data-theme="dark"] .btn.fill { color: #0b1a24; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.fill { color: #0b1a24; } }
.btn.danger { border-color: var(--danger); color: var(--danger); }

/* Thanh thu nhỏ khung nhập và nút Lưu */
.fold-row { display: flex; align-items: center; gap: 8px; }
.fold-row .sp { flex: 1; }
.fold { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); display: grid; place-items: center; flex: none; }
.fold svg { width: 22px; height: 22px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.panel.mini .fold svg { transform: rotate(180deg); }
.mini-sum { flex: 1; min-width: 0; display: none; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-sum .b { color: var(--bao); }
.mini-sum .k { color: var(--kg); }
.savebtn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--card); font-weight: 700; font-size: 14px; flex: none; }
.savebtn.ok { background: transparent; color: var(--muted); border-color: var(--line); }
:root[data-theme="dark"] .savebtn:not(.ok) { color: #0b1a24; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .savebtn:not(.ok) { color: #0b1a24; } }
.panel.mini { gap: 8px; padding-block: 8px 10px; }
.panel.mini .stats, .panel.mini .money, .panel.mini #priceBtn { display: none; }
.panel.mini .mini-sum { display: block; }
.panel.mini .sp { display: none; }
.panel.mini .field input, .panel.mini .go { height: 44px; }
.panel.mini .field input { font-size: 22px; }
.panel.mini .undo { width: 44px; }

/* Lưới thẻ */
.grid { flex: 1; min-height: 0; overflow-y: auto; padding-block: 8px; overscroll-behavior: contain;
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-content: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 22px 0 6px; position: relative; min-width: 0; }
.card .lb { position: absolute; top: 4px; left: 4px; background: var(--badge); color: #fff; font-size: 12px; font-weight: 600; min-width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; padding-inline: 4px; }
.w { display: block; width: 100%; background: none; border: 0; text-align: right; padding: 3px 10px 3px 0; font-size: 19px; font-weight: 500; line-height: 1.25; }
.w:active { background: var(--chip); }
.sum { margin: 3px 6px 0 6px; border-top: 2px solid var(--line); text-align: right; font-size: 19px; font-weight: 600; padding: 3px 4px 0 0; color: var(--sub); }
.sum.part { color: var(--muted); }

.panel { flex: none; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -2px 8px rgba(0,0,0,.08);
  padding-block: 10px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
.stats { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.stat { background: var(--chip); border-radius: 8px; text-align: center; padding: 6px 8px; min-width: 0; }
.stat b { font-size: 32px; font-weight: 700; line-height: 1.15; }
.stat small { font-size: 15px; font-weight: 600; margin-left: 3px; }
.stat.bao b, .stat.bao small { color: var(--bao); }
.stat.kg b, .stat.kg small { color: var(--kg); }
.money { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-inline: 4px; font-size: 14px; color: var(--muted); }
.money b { color: var(--fg); font-size: 19px; }
.entry { display: flex; gap: 8px; align-items: stretch; }
.field { flex: 1; min-width: 0; position: relative; border: 2px solid var(--accent); border-radius: 6px; padding: 0 10px; display: flex; align-items: center; }
.field label { position: absolute; top: -10px; left: 10px; background: var(--card); padding: 0 6px; color: var(--accent); font-size: 13px; font-weight: 600; }
.field input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 26px; font-weight: 600; height: 54px; padding: 0; outline: none; }
.field:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.go { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 20px; letter-spacing: .05em; padding: 0 6px; height: 54px; }
.undo { width: 54px; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); display: grid; place-items: center; }
.undo svg { width: 24px; height: 24px; fill: none; stroke: var(--fg); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.err { color: var(--danger); font-size: 13px; min-height: 0; padding-inline: 4px; }
.err:empty { display: none; }

/* Hộp thoại và menu */
.scrim { position: fixed; inset: 0; background: rgba(8,14,20,.5); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; background: var(--card); border-radius: 16px 16px 0 0; padding: 18px 16px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }
.sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.fl input { height: 48px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; font-size: 18px; font-weight: 600; padding: 0 12px; min-width: 0; }
.result { background: var(--chip); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
.result div { display: flex; justify-content: space-between; gap: 8px; }
.result b { font-size: 17px; }
.menu { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + 54px); right: max(8px, env(safe-area-inset-right, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); overflow: hidden; min-width: 210px; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; font-size: 15px; }
.menu button + button { border-top: 1px solid var(--line); }
.menu button:active { background: var(--chip); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: #1c2a35; color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 14px; z-index: 50; max-width: 90%; }
.ib { position: relative; }
.dot { position: absolute; top: 8px; right: 8px; width: 11px; height: 11px; border-radius: 50%; background: #ff3b30; border: 2px solid var(--bar); }
.sheet h3 { margin: 4px 0 0; font-size: 15px; }
.sheet .ver { background: var(--chip); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
.sheet .ver div { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sheet .ver b { font-size: 16px; text-align: right; }
.sheet .bad { color: var(--danger); }
@media (max-width: 360px) { .w, .sum { font-size: 17px; } .w { padding-right: 6px; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>
<body>

<div id="home" class="view">
  <div class="bar">
    <h1>Sổ Cân Lúa</h1>
    <button class="ib" id="updIc" type="button" aria-label="Cập nhật app"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span class="dot" id="updDot" hidden></span></button>
  </div>
  <div class="list" id="list"></div>
  <div class="foot"><button class="btn fill" id="newBtn" type="button">+ Phiếu cân mới</button></div>
</div>

<div id="sheetView" class="view" hidden>
  <div class="bar">
    <button class="ib" id="back" type="button" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <h1 id="title"></h1>
    <button class="ib" id="priceIc" type="button" aria-label="Tính tiền"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="13" height="17" rx="2"/><path d="M7 7h7M7 11h2M11 11h2M7 15h2M11 15h2"/><circle cx="18" cy="18" r="4.2" fill="var(--bar)"/><path d="M18 16.2v3.6M19.3 16.9c-.5-.5-2.3-.6-2.3.5 0 1.3 2.4.7 2.4 2 0 1-1.9 1-2.5.3"/></svg></button>
    <button class="ib" id="clearIc" type="button" aria-label="Xoá hết số cân"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg></button>
    <button class="ib" id="menuIc" type="button" aria-label="Thêm"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg></button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="panel" id="panel">
    <div class="fold-row">
      <button class="fold" id="fold" type="button" aria-expanded="true" aria-label="Thu nhỏ khung nhập"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="mini-sum" id="miniSum"></span>
      <span class="sp"></span>
      <button class="savebtn" id="saveBtn" type="button">Lưu</button>
    </div>
    <div class="stats">
      <div class="stat bao"><b id="nBao">0</b><small>Bao</small></div>
      <div class="stat kg"><b id="nKg">0.0</b><small>Kg</small></div>
    </div>
    <div class="money" id="money" hidden><span id="moneyLb"></span><b id="moneyVal"></b></div>
    <button class="btn" id="priceBtn" type="button">Nhập giá lúa</button>
    <form class="entry" id="entry" autocomplete="off">
      <button class="undo" id="undo" type="button" aria-label="Xoá số vừa nhập"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <div class="field">
        <label for="inp">Nhập số cân (kg)</label>
        <input id="inp" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off">
        <button class="go" type="submit">NHẬP</button>
      </div>
    </form>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>

<div id="layer"></div>

<script>
/* Ghi lại lỗi để sao chép gửi người sửa app */
(function () {
  function push(m) {
    try {
      var a = JSON.parse(localStorage.getItem('cancua.errors') || '[]');
      a.push({ t: Date.now(), m: String(m).slice(0, 400) });
      localStorage.setItem('cancua.errors', JSON.stringify(a.slice(-20)));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) { push((e.message || 'Lỗi') + ' (dòng ' + (e.lineno || '?') + ':' + (e.colno || '?') + ')'); });
  window.addEventListener('unhandledrejection', function (e) { push('Promise: ' + ((e.reason && e.reason.message) || e.reason)); });
})();
(function () {
  var BUILD = parseInt('__BUILD__', 10) || 0;   /* GitHub Actions điền số bản build */
  var REPO = '__REPO__';                          /* GitHub Actions điền tên kho, dạng chủ/kho */
  var KEY = 'cancua.v1';
  var S = null;
  try { var raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
  if (!S || !S.sessions) {
    S = { sessions: [{
      id: 'vd1', name: 'Ví dụ - Cân lúa tươi', created: Date.now(), price: 0, tare: 0,
      weights: [66,64,51,47,63, 63,52,56,15,63, 47,57,52,36,48, 63,68,33,35,58, 52,50,75,60,77, 76,79,77,67,81, 79,67,56,72,74, 79,60,81,67]
    }], cur: null };
  }
  S.cur = null;
  function save(noMod) {
    if (!noMod && S.cur) { var c = cur(); if (c) c.modAt = Date.now(); }
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  function $(id) { return document.getElementById(id); }
  /* Giữ nguyên số thập phân người dùng nhập (tối đa 6 chữ số), ít nhất 1 chữ số sau dấu chấm. Cộng bằng số nguyên để không bị sai số. */
  function dp(n) { var p = n.toFixed(6).replace(/0+$/, '').split('.')[1]; return p ? p.length : 0; }
  function f1(n) { return n.toFixed(Math.max(1, dp(n))); }
  function sumArr(a) { return a.reduce(function (x, y) { return x + Math.round(y * 1e6); }, 0) / 1e6; }
  function vnd(n) { return Math.round(n).toLocaleString('vi-VN'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function cur() { return S.sessions.filter(function (x) { return x.id === S.cur; })[0]; }
  function total(s) { return sumArr(s.weights); }
  function parseNum(v) { var n = parseFloat(String(v).trim().replace(',', '.')); return isFinite(n) ? n : NaN; }
  function dstr(t) { var d = new Date(t); return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); }

  /* ---------- Danh sách ---------- */
  function renderHome() {
    var l = $('list');
    if (!S.sessions.length) { l.innerHTML = '<div class="empty">Chưa có phiếu cân nào.<br>Bấm "Phiếu cân mới" để bắt đầu.</div>'; return; }
    l.innerHTML = S.sessions.slice().sort(function (a, b) { return b.created - a.created; }).map(function (s) {
      return '<div class="row"><button class="open" type="button" data-id="' + s.id + '"><div class="grow"><div class="nm">' + esc(s.name) + '</div><div class="dt">' + dstr(s.created) + '</div></div>' +
        '<div class="num"><b>' + f1(total(s)) + ' kg</b><span>' + s.weights.length + ' bao</span></div></button>' +
        '<button class="rdel" type="button" data-del="' + s.id + '" aria-label="Xoá phiếu ' + esc(s.name) + '"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg></button></div>';
    }).join('');
  }
  $('list').addEventListener('click', function (e) {
    var d = e.target.closest('.rdel');
    if (d) {
      var id = d.getAttribute('data-del'), s = S.sessions.filter(function (x) { return x.id === id; })[0];
      if (s) confirmBox('Xoá phiếu "' + s.name + '" (' + s.weights.length + ' bao, ' + f1(total(s)) + ' kg)?', 'Xoá phiếu', function () { deleteSession(id); });
      return;
    }
    var b = e.target.closest('.open'); if (b) openSheet(b.getAttribute('data-id'));
  });
  $('newBtn').addEventListener('click', function () {
    var n = S.sessions.length + 1;
    var s = { id: 's' + Date.now(), name: 'Cân lúa ' + new Date().toLocaleDateString('vi-VN'), created: Date.now(), price: 0, tare: 0, weights: [] };
    S.sessions.push(s); save(); openSheet(s.id);
  });

  /* ---------- Phiếu cân ---------- */
  function openSheet(id) {
    S.cur = id; $('home').hidden = true; $('sheetView').hidden = false; renderSheet();
    $('inp').focus();
  }
  function closeSheet() { S.cur = null; $('sheetView').hidden = true; $('home').hidden = false; renderHome(); }
  $('back').addEventListener('click', closeSheet);

  function renderSheet() {
    var s = cur(); if (!s) return;
    $('title').textContent = s.name;
    var html = '', w = s.weights, g, i, sub;
    for (g = 0; g * 5 < w.length; g++) {
      var part = w.slice(g * 5, g * 5 + 5);
      sub = sumArr(part);
      html += '<div class="card"><span class="lb">' + (g * 5 + part.length) + '</span>';
      for (i = 0; i < part.length; i++) html += '<button class="w" type="button" data-i="' + (g * 5 + i) + '">' + f1(part[i]) + '</button>';
      html += '<div class="sum' + (part.length < 5 ? ' part' : '') + '">' + f1(sub) + '</div></div>';
    }
    var gr = $('grid'); gr.innerHTML = html;
    gr.scrollTop = gr.scrollHeight;
    var t = total(s);
    $('nBao').textContent = w.length;
    $('nKg').textContent = f1(t);
    var net = t - (s.tare || 0) * w.length;
    if (s.price > 0) {
      $('money').hidden = false;
      $('moneyLb').textContent = f1(net) + ' kg × ' + vnd(s.price) + ' đ';
      $('moneyVal').textContent = vnd(net * s.price) + ' đ';
      $('priceBtn').textContent = 'Giá lúa ' + vnd(s.price) + ' đ/kg · Sửa';
    } else {
      $('money').hidden = true;
      $('priceBtn').textContent = 'Nhập giá lúa';
    }
    $('miniSum').innerHTML = '<span class="b">' + w.length + ' bao</span> · <span class="k">' + f1(t) + ' kg</span>';
    $('panel').classList.toggle('mini', !!S.mini);
    $('fold').setAttribute('aria-expanded', S.mini ? 'false' : 'true');
    $('fold').setAttribute('aria-label', S.mini ? 'Mở rộng khung nhập' : 'Thu nhỏ khung nhập');
    var dirty = !s.savedAt || (s.modAt || 0) > s.savedAt, sb = $('saveBtn');
    sb.textContent = dirty ? 'Lưu' : 'Đã lưu ✓';
    sb.classList.toggle('ok', !dirty);
    if (s.savedAt) sb.title = 'Lưu lúc ' + new Date(s.savedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  }

  function setErr(m) { $('err').textContent = m || ''; }
  $('entry').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = cur(), n = parseNum($('inp').value);
    if (!(n > 0) || n > 9999) { setErr('Nhập số cân lớn hơn 0 và nhỏ hơn 10000.'); return; }
    setErr(''); s.weights.push(Math.round(n * 1e6) / 1e6); save();
    $('inp').value = ''; renderSheet(); $('inp').focus();
  });
  $('inp').addEventListener('input', function () { setErr(''); });
  $('fold').addEventListener('click', function () {
    S.mini = !S.mini; save(true); renderSheet(); $('inp').focus();
  });
  $('saveBtn').addEventListener('click', function () {
    var s = cur(); s.savedAt = Date.now(); save(true); renderSheet();
    toast('Đã lưu lúc ' + new Date(s.savedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }));
  });
  $('undo').addEventListener('click', function () {
    var s = cur(); if (!s.weights.length) return;
    var before = snap(), x = s.weights.pop(); save(); renderSheet();
    toast('Đã xoá số ' + f1(x), function () { restoreFrom(before); });
    $('inp').focus();
  });

  /* ---------- Hộp thoại ---------- */
  function sheet(html) {
    var layer = $('layer');
    layer.innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
    $('scrim').addEventListener('click', function (e) { if (e.target.id === 'scrim') closeLayer(); });
    return layer;
  }
  function closeLayer() { $('layer').innerHTML = ''; }
  function toast(m, undoFn) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = document.createElement('div'); t.className = 'toast';
    var sp = document.createElement('span'); sp.textContent = m; t.appendChild(sp);
    if (undoFn) {
      var u = document.createElement('button'); u.type = 'button'; u.textContent = 'Hoàn tác';
      u.onclick = function () { t.remove(); undoFn(); };
      t.appendChild(u);
    }
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, undoFn ? 6000 : 1800);
  }
  /* Xoá có thể hoàn tác: chụp lại dữ liệu trước khi xoá */
  function snap() { return JSON.stringify(S.sessions); }
  function restoreFrom(str) {
    S.sessions = JSON.parse(str); save();
    if (S.cur && cur()) renderSheet();
    else { if (S.cur) { S.cur = null; $('sheetView').hidden = true; $('home').hidden = false; } renderHome(); }
    toast('Đã khôi phục');
  }
  function deleteSession(id) {
    var before = snap();
    S.sessions = S.sessions.filter(function (z) { return z.id !== id; }); save();
    if (S.cur === id) closeSheet(); else renderHome();
    toast('Đã xoá phiếu', function () { restoreFrom(before); });
  }

  $('grid').addEventListener('click', function (e) {
    var b = e.target.closest('.w'); if (!b) return;
    var idx = +b.getAttribute('data-i'), s = cur();
    sheet('<h2>Bao thứ ' + (idx + 1) + '</h2><label class="fl">Số cân (kg)<input id="ev" type="text" inputmode="decimal" value="' + s.weights[idx] + '"></label>' +
      '<div class="two"><button class="btn danger" id="evDel" type="button">Xoá bao này</button><button class="btn fill" id="evOk" type="button">Lưu</button></div>' +
      '<button class="btn" id="evNo" type="button" style="border-color:var(--line);color:var(--muted)">Huỷ</button>');
    $('evOk').onclick = function () {
      var n = parseNum($('ev').value);
      if (!(n > 0) || n > 9999) { $('ev').style.borderColor = 'var(--danger)'; return; }
      s.weights[idx] = Math.round(n * 1e6) / 1e6; save(); closeLayer(); renderSheet();
    };
    $('evDel').onclick = function () {
      var before = snap(); s.weights.splice(idx, 1); save(); closeLayer(); renderSheet();
      toast('Đã xoá bao thứ ' + (idx + 1), function () { restoreFrom(before); });
    };
    $('evNo').onclick = closeLayer;
    $('ev').focus(); $('ev').select();
  });

  function priceDialog() {
    var s = cur();
    sheet('<h2>Giá lúa</h2><div class="two">' +
      '<label class="fl">Giá (đ/kg)<input id="pp" type="text" inputmode="numeric" value="' + (s.price || '') + '" placeholder="vd 7200"></label>' +
      '<label class="fl">Trừ bì mỗi bao (kg)<input id="pt" type="text" inputmode="decimal" value="' + (s.tare || '') + '" placeholder="0"></label></div>' +
      '<div class="result" id="pr"></div>' +
      '<div class="two"><button class="btn" id="pNo" type="button">Đóng</button><button class="btn fill" id="pOk" type="button">Lưu giá</button></div>');
    function calc() {
      var p = parseNum($('pp').value) || 0, t = parseNum($('pt').value) || 0, kg = total(s), n = s.weights.length, net = kg - t * n;
      $('pr').innerHTML = '<div><span>Tổng cân</span><b>' + f1(kg) + ' kg</b></div>' +
        (t > 0 ? '<div><span>Trừ bì (' + n + ' bao × ' + t + ' kg)</span><b>− ' + f1(t * n) + ' kg</b></div><div><span>Cân thực</span><b>' + f1(net) + ' kg</b></div>' : '') +
        '<div><span>Thành tiền</span><b>' + vnd(net * p) + ' đ</b></div>';
    }
    $('pp').oninput = calc; $('pt').oninput = calc; calc();
    $('pNo').onclick = closeLayer;
    $('pOk').onclick = function () {
      s.price = Math.max(0, parseNum($('pp').value) || 0); s.tare = Math.max(0, parseNum($('pt').value) || 0);
      save(); closeLayer(); renderSheet();
    };
    $('pp').focus();
  }
  $('priceBtn').addEventListener('click', priceDialog);
  $('priceIc').addEventListener('click', priceDialog);

  function confirmBox(msg, label, fn) {
    sheet('<h2>' + esc(msg) + '</h2><div class="two"><button class="btn" id="cNo" type="button">Huỷ</button><button class="btn danger" id="cYes" type="button">' + esc(label) + '</button></div>');
    $('cNo').onclick = closeLayer; $('cYes').onclick = function () { closeLayer(); fn(); };
  }
  $('clearIc').addEventListener('click', function () {
    if (!cur().weights.length) { toast('Phiếu này chưa có số cân'); return; }
    confirmBox('Xoá hết ' + cur().weights.length + ' bao trong phiếu này?', 'Xoá hết', function () {
      var before = snap(); cur().weights = []; save(); renderSheet();
      toast('Đã xoá hết số cân', function () { restoreFrom(before); });
    });
  });

  $('menuIc').addEventListener('click', function (e) {
    e.stopPropagation(); closeMenu();
    var m = document.createElement('div'); m.className = 'menu'; m.id = 'menu';
    m.innerHTML = '<button type="button" data-a="rename">Đổi tên phiếu</button><button type="button" data-a="copy">Sao chép bảng cân</button><button type="button" data-a="del">Xoá phiếu</button>';
    document.body.appendChild(m);
    m.addEventListener('click', function (ev) {
      var a = ev.target.getAttribute('data-a'); closeMenu(); if (!a) return;
      var s = cur();
      if (a === 'rename') {
        sheet('<h2>Tên phiếu</h2><label class="fl">Tên<input id="rn" type="text" value="' + esc(s.name) + '"></label><div class="two"><button class="btn" id="rNo" type="button">Huỷ</button><button class="btn fill" id="rOk" type="button">Lưu</button></div>');
        $('rNo').onclick = closeLayer;
        $('rOk').onclick = function () { s.name = $('rn').value.trim() || s.name; save(); closeLayer(); renderSheet(); };
        $('rn').focus(); $('rn').select();
      } else if (a === 'copy') {
        var lines = [s.name], g;
        for (g = 0; g * 5 < s.weights.length; g++) {
          var p = s.weights.slice(g * 5, g * 5 + 5);
          lines.push((g * 5 + p.length) + ': ' + p.map(f1).join(' + ') + ' = ' + f1(sumArr(p)));
        }
        lines.push('Tổng: ' + s.weights.length + ' bao, ' + f1(total(s)) + ' kg');
        if (s.price > 0) lines.push('Thành tiền: ' + vnd((total(s) - (s.tare || 0) * s.weights.length) * s.price) + ' đ');
        var txt = lines.join('\n'), done = function () { toast('Đã sao chép'); };
        try { navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); }); } catch (x) { fallbackCopy(txt); }
      } else if (a === 'del') {
        confirmBox('Xoá phiếu "' + s.name + '"?', 'Xoá phiếu', function () { deleteSession(s.id); });
      }
    });
    setTimeout(function () { document.addEventListener('click', closeMenu, { once: true }); }, 0);
  });
  function closeMenu() { var m = $('menu'); if (m) m.remove(); }
  function fallbackCopy(txt) {
    sheet('<h2>Sao chép bảng cân</h2><p>Chọn toàn bộ chữ bên dưới rồi sao chép.</p><label class="fl">Nội dung<textarea id="ct" rows="8" style="border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;padding:8px"></textarea></label><button class="btn" id="ctNo" type="button">Đóng</button>');
    $('ct').value = txt; $('ct').select(); $('ctNo').onclick = closeLayer;
  }

  /* ---------- Cập nhật app ---------- */
  var upd = null;
  function readErrs() { try { return JSON.parse(localStorage.getItem('cancua.errors') || '[]'); } catch (e) { return []; } }
  function checkUpdate(cb) {
    if (REPO.charAt(0) === '_') { cb({ err: 'Bản này chưa gắn với kho GitHub nên chưa kiểm tra cập nhật được.' }); return; }
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; cb({ err: 'Quá lâu không có phản hồi. Kiểm tra mạng rồi thử lại.' }); } }, 12000);
    fetch('https://api.github.com/repos/' + REPO + '/releases/tags/latest', { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status === 404 ? 'Chưa thấy bản phát hành. Kho GitHub cần để chế độ Public và đã build xong ít nhất một lần.' : 'GitHub báo lỗi ' + r.status + '.');
        return r.json();
      })
      .then(function (j) {
        var m = /build:\s*(\d+)/.exec(j.body || '');
        var a = (j.assets || []).filter(function (x) { return /\.apk$/i.test(x.name); })[0];
        if (!m || !a) throw new Error('Không đọc được thông tin bản mới.');
        upd = { build: +m[1], url: a.browser_download_url, size: a.size };
        if (!done) { done = true; clearTimeout(timer); cb({ upd: upd, newer: upd.build > BUILD }); }
      })
      .catch(function (e) {
        var msg = (e && e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message)) ? e.message : 'Không kết nối được. Kiểm tra mạng rồi thử lại.';
        if (!done) { done = true; clearTimeout(timer); cb({ err: msg }); }
      });
  }
  function openUrl(u) {
    var B = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
    try { if (B && B.open) { B.open({ url: u }); return; } } catch (e) {}
    window.open(u, '_blank');
  }
  function showUpdateResult(r) {
    var res = $('uRes'), act = $('uAct'); if (!res) return;
    if (r.err) { res.innerHTML = '<span class="bad">' + esc(r.err) + '</span>'; act.innerHTML = '<button class="btn" id="uRetry" type="button">Kiểm tra lại</button>'; $('uRetry').onclick = runCheck; return; }
    if (r.newer) {
      var mb = r.upd.size ? ' (' + (r.upd.size / 1048576).toFixed(1) + ' MB)' : '';
      res.innerHTML = '<span>Bản mới</span><b>1.0.' + r.upd.build + mb + '</b>';
      act.innerHTML = '<button class="btn fill" id="uGo" type="button">Tải bản mới</button><p style="margin-top:8px">Tải xong, mở file vừa tải để cài. Đừng gỡ app cũ, cài đè lên thì phiếu cân vẫn còn.</p>';
      $('uGo').onclick = function () { openUrl(r.upd.url); };
    } else {
      res.innerHTML = '<span>Bạn đang dùng bản mới nhất</span><b>✓</b>';
      act.innerHTML = '';
    }
  }
  function runCheck() {
    var res = $('uRes'); if (res) res.innerHTML = '<span>Đang kiểm tra bản mới…</span>';
    if ($('uAct')) $('uAct').innerHTML = '';
    checkUpdate(function (r) { $('updDot').hidden = !r.newer; showUpdateResult(r); });
  }
  function errText() {
    var e = readErrs();
    return 'Sổ Cân Lúa 1.0.' + BUILD + '\n' + navigator.userAgent + '\n' + (e.length ? e.map(function (x) { return new Date(x.t).toLocaleString('vi-VN') + ' - ' + x.m; }).join('\n') : '(chưa có lỗi)');
  }
  function updateDialog() {
    var n = readErrs().length;
    sheet('<h2>Cập nhật app</h2>' +
      '<div class="ver"><div><span>Bản đang dùng</span><b>1.0.' + BUILD + '</b></div><div id="uRes"></div></div>' +
      '<div id="uAct"></div>' +
      '<h3>Nhật ký lỗi</h3><p>' + (n ? 'Đã ghi lại ' + n + ' lỗi. Sao chép rồi gửi cho người sửa app để biết lỗi ở đâu.' : 'Chưa có lỗi nào được ghi lại.') + '</p>' +
      '<div class="two"><button class="btn" id="eCp" type="button">Sao chép lỗi</button><button class="btn" id="eClr" type="button">Xoá nhật ký</button></div>' +
      '<button class="btn" id="uClose" type="button" style="border-color:var(--line);color:var(--muted)">Đóng</button>');
    $('uClose').onclick = closeLayer;
    $('eCp').onclick = function () {
      var txt = errText();
      try { navigator.clipboard.writeText(txt).then(function () { toast('Đã sao chép nhật ký lỗi'); }, function () { fallbackCopy(txt); }); } catch (x) { fallbackCopy(txt); }
    };
    $('eClr').onclick = function () { try { localStorage.removeItem('cancua.errors'); } catch (e) {} closeLayer(); toast('Đã xoá nhật ký lỗi'); };
    runCheck();
  }
  $('updIc').addEventListener('click', updateDialog);

  save(); renderHome();
  /* Tự kiểm tra bản mới khi mở app, chỉ hiện chấm đỏ nếu có */
  if (navigator.onLine !== false) setTimeout(function () {
    checkUpdate(function (r) { if (r.newer) { $('updDot').hidden = false; toast('Có bản mới, bấm nút tải xuống ở góc trên'); } });
  }, 2000);
})();
</script>

</body>
</html>
